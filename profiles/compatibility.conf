# ============================================================
# Uyumluluk (Compatibility)
# ============================================================
# Kaynak: baslat.bat -> :FAKE  (secim [2])
# Yontem: --dpi-desync=fake
#   Gercek TCP akisina daha az dokunan "fake" profili.
#   Stable calismazsa once bunu deneyin.
# ============================================================

NAME=Uyumluluk (Fake)
DESCRIPTION=Referans "baslat.bat" dosyasindaki calisan FAKE profili. Degistirilmemistir.
PORT_TCP=443
ARGS=--dpi-desync=fake --dpi-desync-repeats=1 --dpi-desync-autottl=1:4-10 --dpi-desync-skip-nosni=0
