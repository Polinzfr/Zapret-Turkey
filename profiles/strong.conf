# ============================================================
# Guclu (Strong)
# ============================================================
# Kaynak: baslat.bat -> :MULTI  (secim [3])
# Yontem: --dpi-desync=multisplit
#   method ve host konumlarindan bolen, daha guclu son test profili.
#   Stable ve Uyumluluk yetersiz kalirsa deneyin.
# ============================================================

NAME=Guclu (MultiSplit)
DESCRIPTION=Referans "baslat.bat" dosyasindaki calisan MULTISPLIT profili. Degistirilmemistir.
PORT_TCP=443
ARGS=--dpi-desync=multisplit --dpi-desync-split-pos=method,host --dpi-desync-repeats=1 --dpi-desync-autottl=1:4-10 --dpi-desync-skip-nosni=0 --dpi-desync-start=n2 --dpi-desync-cutoff=n5
