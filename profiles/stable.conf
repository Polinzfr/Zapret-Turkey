# ============================================================
# Turkiye Stable  (KNOWN GOOD)
# ============================================================
# Bu profil, kullanicinin kendi bilgisayarinda calistigi
# dogrulanmis "baslat.bat" dosyasindaki HOSTFAKESPLIT profilinden
# BIREBIR alinmistir. Hicbir parametre eklenmemis, cikarilmamis
# veya degistirilmemistir. Bu dosya bozulursa/degistirilirse
# referans olarak repo icindeki KNOWN_GOOD.md dosyasina bakin.
#
# Kaynak: baslat.bat -> :HOST  (secim [1])
# Yontem: --dpi-desync=hostfakesplit
#   SNI/host degerinden hemen sonra hafif bir bolme yapar.
#   Gercek TCP akisina en az mudahale eden profillerden biridir.
# ============================================================

NAME=Turkiye Stable (HostFakeSplit)
DESCRIPTION=Referans "baslat.bat" dosyasindaki calisan HOSTFAKESPLIT profili. Degistirilmemistir.
PORT_TCP=443
ARGS=--dpi-desync=hostfakesplit --dpi-desync-split-pos=sld --dpi-desync-repeats=1 --dpi-desync-autottl=1:4-10 --dpi-desync-skip-nosni=0 --dpi-desync-start=n2 --dpi-desync-cutoff=n5
